# Seikode PR policy, shared by every repository in the organization.
#
# Each repository calls this from its own .github/workflows/ci.yml:
#
#   jobs:
#     policy:
#       uses: Seikode-LLC/.github/.github/workflows/pr-policy.yml@main
#
# The organization ruleset requires the resulting check, "policy / pr-policy",
# to pass before a pull request can merge.

name: PR policy

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Only runs on pull requests
        if: github.event_name != 'pull_request'
        run: |
          echo "::error::The PR policy check only runs on pull_request events."
          exit 1

      - name: Check out the pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: PR title follows the commit convention
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|release)(\([a-z0-9._/-]+\))?!?: .{3,}$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title \"$TITLE\" must look like \"feat(scope): short summary\". Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert, release."
            exit 1
          fi
          echo "Title OK: $TITLE"

      - name: PR description is filled in
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Drop HTML comments (template hints), headings, and blank lines.
          text=$(printf '%s' "$BODY" | perl -0pe 's/<!--.*?-->//gs' | grep -Ev '^\s*(#|$)' || true)
          summary=$(printf '%s\n' "$text" | grep -Ev '^\s*- \[[ xX]\]' || true)
          if [ "$(printf '%s' "$summary" | tr -d '[:space:]' | wc -c)" -lt 20 ]; then
            echo "::error::Fill in the Summary and Testing sections of the PR template (what changed, why, and how you tested it)."
            exit 1
          fi
          unchecked=$(printf '%s\n' "$text" | grep -E '^\s*- \[ \]' || true)
          if [ -n "$unchecked" ]; then
            echo "::error::Every checklist item must be checked. If an item does not apply, check it and write \"N/A\" next to it."
            printf '%s\n' "$unchecked"
            exit 1
          fi
          echo "Description OK"

      - name: Commits carry human authors only
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # AI co-author trailers are not allowed: company history shows only
          # the people who are accountable for the code, and Vercel Hobby
          # rejects deploys of commits with co-authors who are not GitHub users.
          bad=$(git log --format='%h %s%n%b' "$BASE..$HEAD" \
            | grep -Ei 'co-authored-by:.*(claude|anthropic|openai|codex|copilot|gemini|cursor)|generated with \[?(claude|codex|cursor)' || true)
          if [ -n "$bad" ]; then
            echo "::error::Remove AI co-author trailers and \"Generated with\" footers from your commits (git rebase -i, then reword)."
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "Commit trailers OK"

      - name: No secrets in the changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts="$BASE..$HEAD" --redact --no-banner --verbose .

      - name: PR size
        env:
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
        run: |
          total=$((ADDITIONS + DELETIONS))
          if [ "$total" -gt 800 ]; then
            echo "::warning::This PR changes $total lines. Keep PRs under about 400 lines when you can; split large work into smaller PRs."
          fi
          echo "Changed lines: $total"
